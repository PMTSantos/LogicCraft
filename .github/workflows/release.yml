name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release LogicCraft CAD
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Compile Release Binaries
        run: cargo build --release --bins

      - name: Run Test Suite
        run: cargo test --release

      - name: Build Packaging Suite
        shell: pwsh
        run: .\packaging\windows\build_installer.ps1

      - name: Extract Tag Version
        id: get_version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          Write-Output "VERSION=$tag" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LogicCraft CAD ${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/logiccraft.exe
            target/release/logiccraft-updater.exe
            target/installer/LogicCraft-*-windows-x64.zip
            target/installer/*.msi
            target/installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
